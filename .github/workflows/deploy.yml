name: Safarnama CI/CD Pipeline

# When to run: Trigger on any push to the main branch
on:
  push:
    branches:
      - main

# Default working directory: All npm commands run inside ./client
defaults:
  run:
    working-directory: client

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository source code onto the Ubuntu runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install Node.js runtime and cache npm dependencies for speed
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      # Step 3: Clean, deterministic install of project dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Quality Gate - Run behavioral tests.
      # If ANY test fails here, the workflow aborts immediately. Broken code NEVER reaches production!
      - name: Run Tests
        run: npm test

      # Step 5: Compile production Vite bundle with injected Firebase secrets
      - name: Build Application
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      # Step 6: Ship the compiled static dist/ directly to Netlify
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx netlify-cli deploy --prod --dir=dist

